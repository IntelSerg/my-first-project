<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сергей Чернов</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --card: #111111;
      --border: rgba(255,255,255,0.07);
      --accent1: #7c3aed;
      --accent2: #06b6d4;
      --accent3: #ec4899;
      --text: #e2e8f0;
      --muted: #64748b;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 20%, rgba(124,58,237,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 50% 50% at 80% 80%, rgba(6,182,212,0.10) 0%, transparent 70%),
        radial-gradient(ellipse 40% 60% at 50% 50%, rgba(236,72,153,0.06) 0%, transparent 70%);
      pointer-events: none;
      animation: bgPulse 8s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
      0%   { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* Floating particles */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      animation: float linear infinite;
    }

    @keyframes float {
      0%   { transform: translateY(100vh) translateX(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.6; }
      100% { transform: translateY(-10vh) translateX(30px); opacity: 0; }
    }

    /* Card */
    .card {
      position: relative;
      width: min(420px, 92vw);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 40px 40px;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        0 32px 80px rgba(0,0,0,0.8),
        0 0 60px rgba(124,58,237,0.08);
      animation: cardIn 0.7s cubic-bezier(0.22,1,0.36,1) both;
      overflow: hidden;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(32px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Glowing top border */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent1), var(--accent2), transparent);
      animation: borderGlow 3s ease-in-out infinite alternate;
    }

    @keyframes borderGlow {
      0%   { width: 40%; opacity: 0.6; }
      100% { width: 75%; opacity: 1; }
    }

    /* Avatar */
    .avatar-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 28px;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -1px;
      position: relative;
      z-index: 1;
      user-select: none;
    }

    .avatar-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--accent1), var(--accent2), var(--accent3), var(--accent1));
      animation: spin 4s linear infinite;
      z-index: 0;
    }

    .avatar-ring::after {
      content: '';
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: var(--card);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Name */
    .name {
      font-size: clamp(26px, 6vw, 32px);
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.1;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #fff 30%, var(--accent1) 60%, var(--accent2) 90%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 18px rgba(124,58,237,0.5));
      animation: nameGlow 3s ease-in-out infinite alternate;
    }

    @keyframes nameGlow {
      0%   { filter: drop-shadow(0 0 10px rgba(124,58,237,0.4)); }
      100% { filter: drop-shadow(0 0 24px rgba(6,182,212,0.6)); }
    }

    /* Role */
    .role {
      font-size: 14px;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 32px;
      position: relative;
      display: inline-block;
    }

    .role::before,
    .role::after {
      content: '—';
      margin: 0 8px;
      opacity: 0.4;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin-bottom: 28px;
    }

    /* Social icons */
    .socials {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 32px;
    }

    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
      position: relative;
      overflow: hidden;
    }

    .social-link::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--hover-bg, rgba(124,58,237,0.15));
      opacity: 0;
      transition: opacity 0.25s;
    }

    .social-link:hover {
      transform: translateY(-4px) scale(1.08);
      border-color: var(--hover-color, var(--accent1));
      color: var(--hover-color, var(--accent1));
      box-shadow: 0 8px 24px var(--hover-shadow, rgba(124,58,237,0.3));
    }

    .social-link:hover::before { opacity: 1; }

    .social-link svg {
      width: 22px;
      height: 22px;
      position: relative;
      z-index: 1;
      transition: transform 0.25s;
    }

    .social-link:hover svg { transform: scale(1.1); }

    /* Tooltip */
    .social-link[data-tip]::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      background: rgba(20,20,20,0.95);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 11px;
      white-space: nowrap;
      padding: 4px 8px;
      border-radius: 6px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s;
    }

    .social-link:hover::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* CTA Button */
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 32px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(124,58,237,0.35);
    }

    .cta::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent2), var(--accent3));
      opacity: 0;
      transition: opacity 0.3s;
    }

    .cta:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 8px 32px rgba(124,58,237,0.5);
    }

    .cta:hover::before { opacity: 1; }

    .cta:active {
      transform: translateY(0) scale(0.98);
    }

    .cta span, .cta svg {
      position: relative;
      z-index: 1;
    }

    /* Pulse ring on button */
    .cta-wrap {
      position: relative;
      display: inline-block;
    }

    .cta-wrap::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      opacity: 0.25;
      animation: pulseCTA 2s ease-in-out infinite;
      z-index: -1;
    }

    @keyframes pulseCTA {
      0%, 100% { transform: scale(1); opacity: 0.2; }
      50%       { transform: scale(1.04); opacity: 0.4; }
    }

    /* Footer */
    .footer {
      margin-top: 24px;
      font-size: 11px;
      color: rgba(100,116,139,0.5);
      letter-spacing: 0.04em;
    }

    /* Responsive */
    @media (max-width: 400px) {
      .card { padding: 36px 24px 32px; }
    }
  </style>
</head>

  <script>
    // Generate floating particles
    const container = document.getElementById('particles');
    const count = 28;

    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';

      const x = Math.random() * 100;
      const duration = 12 + Math.random() * 18;
      const delay = -Math.random() * 20;
      const size = 1 + Math.random() * 2;
      const colors = ['rgba(124,58,237,0.7)', 'rgba(6,182,212,0.7)', 'rgba(236,72,153,0.5)', 'rgba(255,255,255,0.35)'];
      const color = colors[Math.floor(Math.random() * colors.length)];

      p.style.cssText = `
        left: ${x}%;
        width: ${size}px;
        height: ${size}px;
        background: ${color};
        animation-duration: ${duration}s;
        animation-delay: ${delay}s;
      `;

      container.appendChild(p);
    }

    // Card tilt on mouse move (desktop only)
    const card = document.querySelector('.card');

    document.addEventListener('mousemove', (e) => {
      if (window.innerWidth < 600) return;
      const rect = card.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = (e.clientX - cx) / (window.innerWidth / 2);
      const dy = (e.clientY - cy) / (window.innerHeight / 2);
      const rotX = -dy * 5;
      const rotY = dx * 5;
      card.style.transform = `perspective(900px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    });

    document.addEventListener('mouseleave', () => {
      card.style.transform = 'perspective(900px) rotateX(0deg) rotateY(0deg)';
      card.style.transition = 'transform 0.5s ease';
    });
  </script>
